<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DownRust</title>
    <link rel="stylesheet" href="popup.css" />

  <body>
    <main>
      <h1>Video streams</h1>
