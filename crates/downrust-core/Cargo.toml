# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "downrust-core"
description = "Segmented download engine for DownRust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
authors = ["DownRust contributors"]
publish = false

[dependencies]
tokio = { workspace = true, features = ["process"] }
tokio-util = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
percent-encoding = { workspace = true }
bytes = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
keyring = { workspace = true }
base64 = { workspace = true }
futures-util = { workspace = true }
aes = { workspace = true }
cbc = { workspace = true }
librqbit = { version = "9.1.0", default-features = false, features = ["rust-tls"] }
russh = { version = "0.65.1", default-features = false, features = ["ring"] }
russh-sftp = "3.0.1"
suppaftp = { version = "12.2.1", default-features = false, features = ["tokio-rustls-ring", "rustls-ring"] }
rustls-native-certs = "0.8.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[dev-dependencies]
async-trait = "0.1.92"
downrust-testserver = { path = "../downrust-testserver" }
libunftp = "0.25.0"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
unftp-core = "0.1.1"
unftp-sbe-fs = "0.4.1"
