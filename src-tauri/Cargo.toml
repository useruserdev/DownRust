# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "downrust"
description = "DownRust desktop download manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
authors = ["DownRust contributors"]
publish = false

[build-dependencies]
tauri-build = { version = "~2.7.4", features = [] }

[dependencies]
downrust-core = { path = "../crates/downrust-core" }
tauri = { version = "~2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "~2.5.5"
tauri-plugin-notification = "~2.8.1"
tauri-plugin-dialog = "~2.8.4"
tauri-plugin-opener = "~2.7.3"
tauri-plugin-autostart = "~2.7.0"
tauri-plugin-clipboard-manager = "~2.5.0"
axum = { workspace = true }
tauri-plugin-window-state = "~2.5.0"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
sys-locale = "0.3.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Power"] }
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications", "Foundation"] }
