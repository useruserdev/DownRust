[workspace]
resolver = "2"
members = ["crates/downrust-core", "crates/downrust-testserver", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[workspace.dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-util = "0.7.20"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "system-proxy", "socks"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
percent-encoding = "2.3.2"
bytes = "1.12.1"
futures-util = "0.3.34"
axum = "0.8.9"
uuid = { version = "1.29.2", features = ["v4"] }
tempfile = "3.27.0"
sha2 = "0.10.9"
hex = "0.4.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
keyring = { version = "3.6.3", features = ["windows-native"] }
base64 = "0.23.1"
aes = "0.8.4"
cbc = { version = "0.1.2", features = ["alloc", "block-padding"] }

[profile.dev.package."*"]
opt-level = 2
